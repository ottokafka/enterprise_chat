<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Secure Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            color: #1F2937;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- HTMX dynamically injects auth status here -->
        <div hx-get="/auth-status" hx-trigger="load">
            <div style="text-align: center; color: #6B7280; font-weight: 500;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="spin"
                    style="animation: spin 1s linear infinite; margin-bottom: 12px; display: inline-block;"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                </svg>
                <div style="animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">Loading secure experience...
                </div>
            </div>
            <style>
                @keyframes spin {
                    100% {
                        transform: rotate(360deg);
                    }
                }

                @keyframes pulse {

                    0%,
                    100% {
                        opacity: 1;
                    }

                    50% {
                        opacity: .5;
                    }
                }
            </style>
        </div>
    </div>
</body>

</html>
